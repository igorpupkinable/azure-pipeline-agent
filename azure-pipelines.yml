parameters:
- name: poolImage
  default: ubuntu-22.04
  displayName: Agent builder
  type: string
  values:
  - ubuntu-22.04
  - ubuntu-24.04
  - ubuntu-latest
- name: imageName
  default: azure_ubuntuminimalpro22.04.1x64gen2tl.vhd
  displayName: Agent base image
  type: string
  values:
  - azure_ubuntuminimalpro22.04.1x64gen2tl.vhd
- name: sourceImageVersion
  default: 1.100.0
  displayName: Agent base image version
  type: string
- name: destinationImageVersion
  default: BuildId
  displayName: Agent image Gallery version (e.g. 1.23.405)
  type: string
- name: destinationOsDiskSize
  default: 4
  displayName: Agent OS disk size in GB
  type: number
  values:
  - 4
  - 8
  - 16
  - 30
  - 32
- name: dockerImagesToCache
  default: none
  displayName: Space separated list of Docker Hub image tags to cache
  type: string
trigger:
- main

jobs:
- job: build
  displayName: Build
  pool:
    vmImage: ${{ parameters.poolImage }}
  steps:
  - task: DownloadSecureFile@1
    displayName: 'Download certificate'
    inputs:
      secureFile: 96134ed7-3fce-4488-a47d-46dd0725d0b0
    name: agentBuilderCertificate
  - task: Bash@3
    continueOnError: false
    displayName: 'Build agent'
    env:
      DOCKERHUB_LOGIN: $(DOCKERHUB_LOGIN)
      DOCKERHUB_PAT: $(DOCKERHUB_PAT)
      PKR_VAR_build_resource_group_name: $(PKR_VAR_build_resource_group_name)
      PKR_VAR_client_cert_password: $(PKR_VAR_client_cert_password)
      PKR_VAR_client_cert_path: $(agentBuilderCertificate.secureFilePath)
      PKR_VAR_client_id: $(PKR_VAR_client_id)
      PKR_VAR_gallery_name: $(PKR_VAR_gallery_name)
      PKR_VAR_resource_group_name: $(PKR_VAR_resource_group_name)
      PKR_VAR_subscription_id: $(PKR_VAR_subscription_id)
      PKR_VAR_tenant_id: $(PKR_VAR_tenant_id)
    inputs:
      failOnStderr: true
      filePath: ./build-agent.sh
  variables:
  - group: agent-builder-auth
  - group: agent-builder-build
  - name: BUILD_NUMBER
    readonly: true
    value: $(Build.BuildNumber)
  - name: IMAGE_NAME
    readonly: true
    value: ${{ parameters.imageName }}
  - name: DESTINATION_IMAGE_VERSION
    readonly: true
    ${{ if eq(parameters.destinationImageVersion, 'BuildId') }}:
      value: '0.0.$(Build.BuildId)'
    ${{ else }}:
      value: ${{ parameters.destinationImageVersion }}
  - name: DESTINATION_OSDISK_SIZE
    readonly: true
    value: ${{ parameters.destinationOsDiskSize }}
  - name: DOCKERHUB_IMAGES
    readonly: true
    ${{ if ne(parameters.dockerImagesToCache, 'none') }}:
      value: ${{ parameters.dockerImagesToCache }}
  - name: SOURCE_IMAGE_VERSION
    readonly: true
    value: ${{ parameters.sourceImageVersion }}
  - name: TEMPLATES_DIR
    readonly: true
    value: images/ubuntu/templates
